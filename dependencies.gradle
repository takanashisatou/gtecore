// Sibling module project dependency with a clear error when the module is
// missing (standalone build without the GTE monorepo layout).
def requireSibling(String path, String dirName) {
    def p = findProject(path)
    if (p == null) {
        throw new GradleException(
            "Sibling module '${dirName}' not found (looked for project '${path}'). " +
            "Standalone builds need the GTE monorepo layout: modules/gtecore with " +
            "modules/${dirName} checked out beside it. Alternatively build from the " +
            "aggregate root (GTEGroup/gradlew.bat :modules:gtecore:compileJava).")
    }
    return p
}

dependencies {
    compileOnly(libs.jetbrains.annotations)

    // Mixin (& Extras)
    annotationProcessor(variantOf(libs.mixin) { classifier("processor") })
    api(annotationProcessor(forge.mixinExtras.common.get()))
    
    // LDLib (provided by gtm-reborn / FirstDarkDev)
    modCompileOnly(forge.ldlib)
    
    // Registrate (provided by gtm-reborn)
    modCompileOnly(forge.registrate)

    // Configuration
    modCompileOnly(forge.configuration)
    
    // -----------------------------------------------------------------------
    // Direct Cross-Module Source Dependency to gtm-reborn
    // -----------------------------------------------------------------------
    // Deliberately NOT using compileOnly(project(...).sourceSets.main.output):
    // ModDevGradle's legacyForge plugin rewrites every FileCollectionDependency
    // in implementation/compileOnly/api/runtimeOnly into a mappings-attribute
    // constraint (ObfuscationExtension.createRemappingConfiguration). In a
    // standalone build where this repository is the root project AND a source
    // module with these dependencies, that wiring closes a task-dependency loop
    // ("Circular dependency between the following tasks: :classes ...").
    // implementation(project(...)) alone already puts the sibling classes on
    // the compile classpath.
    implementation(requireSibling(':modules:gtm-reborn', 'gtm-reborn')) {
        transitive = false
    }

    // GregTech Addons
    modCompileOnly("blank:gtmthings:1.5.4")
    implementation(requireSibling(':modules:gt--', 'gt--')) {
        transitive = false
    }
    
    // Recipe Viewers
    modCompileOnly(forge.bundles.jei)

    // WAILA-likes
    modCompileOnly(forge.jade)

    // Curios
    modCompileOnly(forge.curios)
    
    // AE2
    modCompileOnly(forge.ae2)
    modCompileOnly(forge.ae2wtlib)
    modCompileOnly(forge.extendedae)

    // FTB
    modCompileOnly(forge.architectury)

    // KubeJS
    modCompileOnly(forge.kubejs)
    modCompileOnly(forge.rhino)

    // Shimmer / Render
    modCompileOnly(forge.shimmer)
    modCompileOnly(forge.embeddium)
    modCompileOnly(forge.oculus)
    modCompileOnly(forge.modernfix)

    modCompileOnly(forge.guideme)

    modLocalRuntime(forge.configuration)
    // Standard runtime mods //
    modClientLocalRuntime(forge.jade)
    modLocalRuntime(forge.curios)
    modLocalRuntime(forge.ferritecore)

    modLocalRuntime(forge.glodium)
    modLocalRuntime(forge.clothconfig)
    // AE2 //
    modLocalRuntime(forge.guideme)
    modLocalRuntime(forge.ae2)
    modLocalRuntime(forge.ae2wtlib)
    modLocalRuntime(forge.extendedae)

    modLocalRuntime(forge.ldlib)

    // Named standalone copies of libraries that gtm-reborn/gt-- embed via
    // jarJar as SRG jars. Dev jars no longer carry those embeds (they crashed
    // named dev runs), so every run config must provide its own remapped copy.
    modLocalRuntime(forge.registrate)
    // Pin 0.5.5: gtm-reborn resolves mixinextras via a `[0.5.0-rc.3,)` require
    // range, i.e. 0.5.5, so dev runs must load the same API level.
    modLocalRuntime("io.github.llamalad7:mixinextras-forge:0.5.5")
    // gt-- (gtnn) is written in Kotlin and needs the Kotlin runtime that its
    // jarJar'd kotlinforforge used to provide.
    modLocalRuntime(forge.kotlinforforge)

    // FTB //
    modLocalRuntime(forge.architectury)

    // Sophisticated Mods //
    modLocalRuntime(forge.sophisticatedcore)
    modLocalRuntime(forge.sophisticatedbackpacks)
    modLocalRuntime(forge.sophisticatedstorage)

    // Runtime Recipe Viewers //
    modLocalRuntime(forge.jei.forge.impl)

    // Ponder / Flywheel //
    modLocalRuntime(forge.ponder)
    modLocalRuntime(forge.flywheel.forge)

    renderNurseCfg(libs.renderNurse)

    // GregTech Addon Runtime
    modLocalRuntime("blank:gtmthings:1.5.4")
}