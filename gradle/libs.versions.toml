[versions]
minecraft = "1.20.1"
# Must match the aggregate build (root gradle/libs.versions.toml), gradle.properties
# and gte/pack.toml: gtmthings 1.5.4 requires forge "[47.4.1,)", while 47.4.10 ships
# ASM 9.8 / coremods 5.2.4 and appliedenergistics2 15.4.9's mixins stop resolving
# there, so 47.4.1 is the only version that satisfies both.
#
# This catalog only applies to a standalone build of this repository -- the
# aggregate build includes this directory through the root settings.gradle, whose
# catalog wins. It was 47.4.4 with minecraftForge 47.4.3, so a standalone build
# compiled against a different Forge than CI shipped, and against a version pair
# that did not even agree with itself.
forge = "47.4.1"
minecraftForge = "1.20.1-47.4.1"
parchment = "2023.09.03" # https://parchmentmc.org/docs/getting-started
shadow = "8.3.5"
spotless = "7.0.2"
modDevGradle = "2.0.86"
lombok = "8.14"
jetbrains-annotations = "26.0.1"
renderNurse = "0.0.12"
mixin = "0.8.7"

[libraries]
minecraft               = { module = "com.mojang:minecraft", version.ref = "minecraft" }
minecraftForge          = { module = "net.minecraftforge:forge", version.ref = "minecraftForge" }
jetbrains-annotations   = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
renderNurse             = { module = "net.neoforged:render-nurse", version.ref = "renderNurse" }
mixin                   = { module = "org.spongepowered:mixin", version.ref = "mixin" }

[plugins]
modDevGradle            = { id = "net.neoforged.moddev.legacyforge", version.ref = "modDevGradle" }
shadow                  = { id = "com.gradleup.shadow", version.ref = "shadow" }
spotless                = { id = "com.diffplug.spotless", version.ref = "spotless" }
lombok                  = { id = "io.freefair.lombok", version.ref = "lombok" }