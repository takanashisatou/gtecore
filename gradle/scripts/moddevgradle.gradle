ext.isJetbrainsRuntime = System.getProperty('java.vm.vendor').contains('JetBrains')

mixin {
    var refmap = add sourceSets.main, "gtecore.refmap.json"
    slimJar.from refmap
    config "gtecore.mixins.json"
}

// Force LWJGL version 3.3.2 for Java 21 support
configurations.configureEach {
    resolutionStrategy {
        eachDependency {
            if (it.requested.group == "org.lwjgl") {
                it.useVersion("3.3.2")
                it.because("We need a version of LWJGL that supports java 21")
            }
        }
    }
}

legacyForge {
    version = libs.versions.minecraftForge.get()

    parchment {
        minecraftVersion = libs.versions.minecraft.get()
        mappingsVersion = libs.versions.parchment.get()
    }

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    interfaceInjectionData = project.files('injected_interfaces/interfaces.json')

    addModdingDependenciesTo(sourceSets.test)

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            // Keep test classes out of datagen and ordinary development clients.
            if (gradle.startParameter.taskNames.any {
                it.endsWith('runGameTestServer') || it.endsWith('prepareGameTestServerRun')
            }) {
                sourceSet(sourceSets.test)
            }
        }
    }
    runs {
        client {
            client()
            sourceSet = sourceSets.main
            ideName = "GTECore Client"
            gameDirectory.set(file('run/client'))
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
            systemProperty('forge.logging.console.level', 'info')
            systemProperty('embeddium.allow_broken_mods', 'true')
            systemProperty('fml.earlyprogresswindow', 'false')
            systemProperty('forge.earlyWindow', 'false')
            jvmArguments.addAll('-Xmx6G', '-XX:+UseG1GC', '-Dfml.earlyprogresswindow=false', '-Dforge.earlyWindow=false', '-Dfile.encoding=UTF-8', '-Dsun.stdout.encoding=UTF-8', '-Dsun.stderr.encoding=UTF-8')
        }

        server {
            server()
            sourceSet = sourceSets.main
            ideName = "Server"

            gameDirectory.set(file('run/server'))
            programArguments.addAll('--nogui', '--world', 'world-extra')
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
        }

        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.test
            ideName = "Game Tests"

            gameDirectory.set(file('run/gametest'))
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
            environment('TEST', 'true')
        }

        data {
            data()
            sourceSet = sourceSets.main
            ideName = "Data Generation"

            gameDirectory.set(file('run/data'))
            programArguments.addAll('--mod', project.mod_id)
            programArguments.addAll('--all')
            programArguments.addAll('--output', file('src/generated/resources/').getAbsolutePath())
            programArguments.addAll('--existing', file('src/main/resources/').getAbsolutePath())
            programArguments.addAll('--existing-mod', 'gtceu')
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            jvmArgument('-ea:org.satou.gtecore...')
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

tasks.matching { it.name == 'runData' || it.name == 'prepareDataRun' }.configureEach {
    dependsOn(tasks.named('processResources'))
    doFirst {
        file('src/generated/resources').mkdirs()
        file('run/data').mkdirs()
    }
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        // SophisticatedCore lazily writes enabledItems during recipe loading.
        // Seed the pack's complete config to avoid concurrent first-run writes on Windows.
        def packConfig = file("${rootDir}/gte/overrides/config/sophisticatedcore-common.toml")
        if (packConfig.exists()) {
            copy {
                from packConfig
                into file('run/gametest/config')
            }
        }
    }
    doLast {
        // Forge can return exit code zero after datapack initialization fails.
        def log = file('run/gametest/logs/latest.log')
        if (!log.exists() || !(log.getText('UTF-8') =~ /All [1-9][0-9]* required tests passed/).find()) {
            throw new GradleException('GameTest did not report passing required tests; inspect run/gametest/logs/latest.log')
        }
    }
}

jar {
    exclude "**/.cache"
    exclude "**/SimplifiedToTraditional.properties"
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
