distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Must match the aggregate build (root gradle/wrapper/gradle-wrapper.properties)
# and gtm-reborn: a standalone build shares the ~/.gradle module/metadata caches
# with the aggregate build, and a different Gradle version splits those caches
# and forces re-resolution (which fails for repos unreachable from this network).
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.14-bin.zip
networkTimeout=30000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
