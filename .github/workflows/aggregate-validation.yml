name: GTECore Aggregate Validation

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: aggregate-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Compile and Datagen in GTE-Multi
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      MODULE_REF: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout aggregate build and sibling modules
        uses: actions/checkout@v4
        with:
          repository: takanashisatou/GregtechEasy
          ref: main
          submodules: recursive
          fetch-depth: 0
      - name: Select the exact GTECore pull request commit
        run: |
          git -C modules/gtecore fetch origin $env:MODULE_REF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C modules/gtecore checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Set up Java 17 and 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile and generate registered resources
        run: |
          .\gradlew.bat :modules:gtecore:compileJava :modules:gtecore:runData -Pwerror --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run required GTECore GameTests
        run: |
          .\gradlew.bat :modules:gtecore:runGameTestServer --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
