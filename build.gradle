plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    alias libs.plugins.modDevGradle
    alias libs.plugins.spotless
    alias libs.plugins.lombok
}

group = maven_group

// ---------------------------------------------------------------------------
// Nightly version carries its BUILD NUMBER (the commit it was built from)
// ---------------------------------------------------------------------------
// A plain `3.0.7-nightly` is the same string for every commit, and the tree did
// exactly that until 2026-09-24: three module jars sat in gte/overrides/mods/
// built on 2026-09-01 while the module gained 28 source files on 2026-09-20, and
// nothing could tell the two apart - same modId, same version, no ordering for
// Forge to arbitrate, and the shipped pack silently three weeks behind.
//
// So a nightly build number is the commit it came from: `3.0.7-nightly-0c30e47`.
// The number is resolved lazily from git at build time, never written into
// gradle.properties - a static file cannot contain the hash of the commit that
// writes it, and a hash committed by hand is a hash that is wrong the moment the
// next commit lands.
//
// `--dirty` is kept on purpose: a worktree with uncommitted changes gets
// `3.0.7-nightly-0c30e47-dirty`, which does not correspond to any commit and must
// never be published. That is the signal to notice, not something to strip.
//
// Only the nightly version carries a build number. `gtm-reborn` (8.3.2) and
// `gt--` (1.3.5.1) keep clean release versions - a SHA in those would make every
// build a different version and break any version-range dependency on them.
def buildNumber = providers.provider {
    try {
        def stdout = new ByteArrayOutputStream()
        def result = exec {
            commandLine 'git', 'describe', '--always', '--dirty'
            workingDir = projectDir
            standardOutput = stdout
            ignoreExitValue = true
        }
        // A source tarball or a checkout without git has no hash to report; the
        // empty string keeps the version valid rather than failing the build.
        result.exitValue == 0 ? stdout.toString().trim() : ''
    } catch (Exception ignored) {
        ''
    }
}

boolean isSnapshot = System.getenv("SNAPSHOT")
// `.get()` rather than handing Gradle the Provider: `Project.version` runs its
// value through `fileOperations.file(...)`, which stringifies a provider instead
// of resolving it - the version came out as the literal `and(provider(?), ...)`.
// Reading the provider (rather than shelling out directly) is still what makes
// this configuration-cache friendly: Gradle tracks the exec as an input, so a new
// commit invalidates the cache entry instead of reusing a stale hash.
def sha = buildNumber.get()
version = "${mod_version}" + (isSnapshot ? "-SNAPSHOT" : "") + (sha ? "-${sha}" : "")
boolean isCI = System.getenv("CI") != null

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

sourceSets {
    main.resources {
        srcDir 'src/generated/resources'
    }

    client {
        compileClasspath += main.output
        runtimeClasspath += main.output + main.runtimeClasspath
    }

    test {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }

    extra {
        compileClasspath += main.output
        runtimeClasspath += main.output + main.runtimeClasspath
    }

    clientExtra {
        compileClasspath += client.output + extra.compileClasspath
        runtimeClasspath += client.output + client.runtimeClasspath + extra.runtimeClasspath
    }
}

configurations {
    library
    implementation.extendsFrom library
    // set these as unresolvable so we don't accidentally force all dependents to use them with us
    clientRuntimeOnly.canBeResolved = false
    extraRuntimeOnly.canBeResolved = false
    clientExtraRuntimeOnly.canBeResolved = false

    runtimeClasspath.extendsFrom localRuntime
    extraRuntimeClasspath.extendsFrom extraLocalRuntime
    clientRuntimeClasspath.extendsFrom clientLocalRuntime
    extraClientRuntimeClasspath.extendsFrom clientExtraLocalRuntime

    renderNurseCfg {
        canBeConsumed = false
    }
}

afterEvaluate {
    configurations {
        // same as above but for the modRuntimeOnly configurations
        modClientRuntimeOnly.canBeResolved = false
        modExtraRuntimeOnly.canBeResolved = false
        modClientExtraRuntimeOnly.canBeResolved = false
    }
}

obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
    createRemappingConfiguration(configurations.clientLocalRuntime)

    createRemappingConfiguration(configurations.extraLocalRuntime)
    createRemappingConfiguration(configurations.clientExtraLocalRuntime)
}

apply from: "$projectDir/gradle/scripts/jars.gradle"
apply from: "$projectDir/gradle/scripts/moddevgradle.gradle"
apply from: "$projectDir/gradle/scripts/repositories.gradle"
apply from: "$projectDir/dependencies.gradle"
apply from: "$projectDir/gradle/scripts/resources.gradle"
apply from: "$projectDir/gradle/scripts/publishing.gradle"

generateModMetadata.doFirst {
    file('run/server').mkdirs()
    file('run/data').mkdirs()
    file('src/generated/resources').mkdirs()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    
    boolean enableWerror = project.hasProperty('werror') || 
                           System.getenv('WERROR') == 'true' ||
                           project.findProperty('werror') == 'true' ||
                           (System.getenv("GITHUB_REF_TYPE") == "tag" && System.getenv("GITHUB_REF_NAME")?.startsWith("v"))

    if (enableWerror) {
        options.compilerArgs << "-Werror"
    }

    options.compilerArgs << "-Xlint:-removal"
    options.compilerArgs << "-Aquiet=true"
}

// Test sources have no Mixin processor; keep -Werror without its unused -Aquiet flag.
tasks.named('compileTestJava', JavaCompile).configure {
    options.compilerArgs.removeAll { it.startsWith('-Aquiet=') }
}

lombok {
    version = "1.18.38"
}
